name: CI

on:
  push:
    branches:
      - main
      - feature/cicd

  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Run tests
        working-directory: .
        run: npm test

  validate-prometheus:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Prometheus
        run: |
          wget -q https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          tar -xzf prometheus-3.5.0.linux-amd64.tar.gz

      - name: Validate Prometheus configuration
        run: |
          ./prometheus-3.5.0.linux-amd64/promtool check config prometheus/prometheus.yml

      - name: Validate alert rules
        run: |
          ./prometheus-3.5.0.linux-amd64/promtool check rules prometheus/rules/alerts.yml
  security:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
  docker-image-scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t snrt-monitoring:${{ github.sha }} \
            .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: snrt-monitoring:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
